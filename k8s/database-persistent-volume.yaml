apiVersion: v1
kind: PersistentVolume
metadata:
  name: database-persistent-volume
  labels:
    app: smart-inventory
    component: postgres
spec:
  capacity:
    storage: 2Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  hostPath:
    path: /home/moha/data/smart-inventory-postgres
