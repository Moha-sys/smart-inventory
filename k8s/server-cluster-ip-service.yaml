apiVersion: v1
kind: Service
metadata:
  name: server-cluster-ip-service
  labels:
    app: smart-inventory
    component: server
spec:
  type: ClusterIP
  selector:
    component: server
  ports:
    - name: http
      port: 3000
      targetPort: 3000
