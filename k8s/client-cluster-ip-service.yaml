apiVersion: v1
kind: Service
metadata:
  name: client-cluster-ip-service
  labels:
    app: smart-inventory
    component: client
spec:
  type: ClusterIP
  selector:
    component: client
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  labels:
    app: smart-inventory
    component: client
spec:
  type: ClusterIP
  selector:
    component: client
  ports:
    - name: http
      port: 80
      targetPort: 80
