apiVersion: v1
kind: Service
metadata:
  name: worker-cluster-ip-service
  labels:
    app: smart-inventory
    component: worker
spec:
  type: ClusterIP
  selector:
    component: worker
  ports:
    - name: http
      port: 3001
      targetPort: 3001
