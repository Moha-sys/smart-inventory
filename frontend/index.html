<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Smart Inventory</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet" />
    <!-- Apply saved theme/language before first paint to avoid a flash -->
    <script>
      (function () {
        try {
          var theme = localStorage.getItem('si-theme') || 'system';
          var dark = theme === 'dark' || (theme === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
          var lang = localStorage.getItem('si-lang');
          if (lang !== 'ar' && lang !== 'en') lang = (navigator.language || 'en').slice(0, 2) === 'ar' ? 'ar' : 'en';
          var d = document.documentElement;
          d.dataset.theme = dark ? 'dark' : 'light';
          d.lang = lang;
          d.dir = lang === 'ar' ? 'rtl' : 'ltr';
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
