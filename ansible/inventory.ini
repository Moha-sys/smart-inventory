# ============================================================
# Smart Inventory - Ansible Inventory Configuration
# ============================================================

# Target 1: Local development node / control machine (default)
[k8s_nodes]
localhost ansible_connection=local ansible_python_interpreter=/usr/bin/python3

# Target 2: Remote Linux Virtual Machine / Kubernetes Node
# To target a remote server instead of localhost, comment out localhost above,
# uncomment the line below, and update the host IP, username, and SSH key path:
#
# [k8s_nodes]
# remote-k8s-node ansible_host=192.168.1.100 ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/id_rsa ansible_python_interpreter=/usr/bin/python3

[k8s_nodes:vars]
ansible_ssh_common_args='-o StrictHostKeyChecking=no'
