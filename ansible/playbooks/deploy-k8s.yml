---
# ============================================================
# Ansible Playbook: Deploy to Kubernetes
# Deploys Secrets, ConfigMaps, PVC, Services, Deployments, and Ingress
# ============================================================
- name: Deploy Smart Inventory System to Kubernetes
  hosts: k8s_nodes
  gather_facts: false
  become: false

  vars:
    image_tag: "{{ lookup('env', 'BUILD_NUMBER') | default('latest', true) }}"
    dockerhub_username: "{{ lookup('env', 'DOCKERHUB_USERNAME') | default('mohadevv', true) }}"
    k8s_dir: "{{ playbook_dir }}/../../k8s"
    namespace: "default"
    rollout_timeout: "120s"

  tasks:
    - name: Display Deployment Parameters
      ansible.builtin.debug:
        msg:
          - "Deploying Smart Inventory to Kubernetes"
          - "DockerHub Username : {{ dockerhub_username }}"
          - "Image Tag          : {{ image_tag }}"
          - "Manifests Directory: {{ k8s_dir }}"
          - "Namespace          : {{ namespace }}"

    # ------------------------------------------------------------
    # 1. Cluster Health & Connectivity Check
    # ------------------------------------------------------------
    - name: Verify connection to Kubernetes cluster
      ansible.builtin.command: kubectl cluster-info
      changed_when: false

    # ------------------------------------------------------------
    # 2. Apply Storage, Secrets & ConfigMaps First
    # ------------------------------------------------------------
    - name: Ensure Host Directory for Postgres PV exists
      ansible.builtin.file:
        path: /home/moha/data/smart-inventory-postgres
        state: directory
        mode: '0777'
      ignore_errors: true

    - name: Apply Persistent Volume (database-persistent-volume)
      ansible.builtin.command: kubectl apply -f {{ k8s_dir }}/database-persistent-volume.yaml
      register: pv_out
      changed_when: "'configured' in pv_out.stdout or 'created' in pv_out.stdout"
      ignore_errors: true

    - name: Apply Kubernetes Secret (app-secrets)
      ansible.builtin.command: kubectl apply -f {{ k8s_dir }}/secret.yaml -n {{ namespace }}
      register: secret_out
      changed_when: "'configured' in secret_out.stdout or 'created' in secret_out.stdout"

    - name: Apply Kubernetes ConfigMap (app-config)
      ansible.builtin.command: kubectl apply -f {{ k8s_dir }}/configmap.yaml -n {{ namespace }}
      register: config_out
      changed_when: "'configured' in config_out.stdout or 'created' in config_out.stdout"

    - name: Apply Persistent Volume Claim (database-persistent-volume-claim)
      ansible.builtin.command: kubectl apply -f {{ k8s_dir }}/database-persistent-volume-claim.yaml -n {{ namespace }}
      register: pvc_out
      changed_when: "'configured' in pvc_out.stdout or 'created' in pvc_out.stdout"

    # ------------------------------------------------------------
    # 3. Apply ClusterIP Services
    # ------------------------------------------------------------
    - name: Apply Database ClusterIP Service (postgres-cluster-ip-service)
      ansible.builtin.command: kubectl apply -f {{ k8s_dir }}/postgres-cluster-ip-service.yaml -n {{ namespace }}
      register: db_svc_out
      changed_when: "'configured' in db_svc_out.stdout or 'created' in db_svc_out.stdout"

    - name: Apply Backend ClusterIP Service (server-cluster-ip-service)
      ansible.builtin.command: kubectl apply -f {{ k8s_dir }}/server-cluster-ip-service.yaml -n {{ namespace }}
      register: srv_svc_out
      changed_when: "'configured' in srv_svc_out.stdout or 'created' in srv_svc_out.stdout"

    - name: Apply Worker ClusterIP Service (worker-cluster-ip-service)
      ansible.builtin.command: kubectl apply -f {{ k8s_dir }}/worker-cluster-ip-service.yaml -n {{ namespace }}
      register: wrk_svc_out
      changed_when: "'configured' in wrk_svc_out.stdout or 'created' in wrk_svc_out.stdout"

    - name: Apply Frontend ClusterIP Service (client-cluster-ip-service)
      ansible.builtin.command: kubectl apply -f {{ k8s_dir }}/client-cluster-ip-service.yaml -n {{ namespace }}
      register: cli_svc_out
      changed_when: "'configured' in cli_svc_out.stdout or 'created' in cli_svc_out.stdout"

    # ------------------------------------------------------------
    # 4. Apply Deployments
    # ------------------------------------------------------------
    - name: Apply Database Deployment (postgres-deployment)
      ansible.builtin.command: kubectl apply -f {{ k8s_dir }}/postgres-deployment.yaml -n {{ namespace }}
      register: db_dep_out
      changed_when: "'configured' in db_dep_out.stdout or 'created' in db_dep_out.stdout"

    - name: Apply Backend Deployment (server-deployment)
      ansible.builtin.command: kubectl apply -f {{ k8s_dir }}/server-deployment.yaml -n {{ namespace }}
      register: srv_dep_out
      changed_when: "'configured' in srv_dep_out.stdout or 'created' in srv_dep_out.stdout"

    - name: Apply Worker Deployment (worker-deployment)
      ansible.builtin.command: kubectl apply -f {{ k8s_dir }}/worker-deployment.yaml -n {{ namespace }}
      register: wrk_dep_out
      changed_when: "'configured' in wrk_dep_out.stdout or 'created' in wrk_dep_out.stdout"

    - name: Apply Frontend Deployment (client-deployment)
      ansible.builtin.command: kubectl apply -f {{ k8s_dir }}/client-deployment.yaml -n {{ namespace }}
      register: cli_dep_out
      changed_when: "'configured' in cli_dep_out.stdout or 'created' in cli_dep_out.stdout"

    # ------------------------------------------------------------
    # 5. Apply Ingress Routing
    # ------------------------------------------------------------
    - name: Apply Ingress Controller Route (ingress-service)
      ansible.builtin.command: kubectl apply -f {{ k8s_dir }}/ingress-service.yaml -n {{ namespace }}
      register: ing_out
      changed_when: "'configured' in ing_out.stdout or 'created' in ing_out.stdout"

    # ------------------------------------------------------------
    # 6. Set Image Tags (when provided via CI / image_tag variable)
    # ------------------------------------------------------------
    - name: Update Client Deployment Image
      ansible.builtin.command: >
        kubectl set image deployment/client-deployment
        client={{ dockerhub_username }}/smart-inventory-client:{{ image_tag }}
        -n {{ namespace }}
      when: dockerhub_username != '<DOCKERHUB_USERNAME>'
      register: set_img_cli
      changed_when: "'image updated' in set_img_cli.stdout"

    - name: Update Server Deployment Image
      ansible.builtin.command: >
        kubectl set image deployment/server-deployment
        server={{ dockerhub_username }}/smart-inventory-server:{{ image_tag }}
        -n {{ namespace }}
      when: dockerhub_username != '<DOCKERHUB_USERNAME>'
      register: set_img_srv
      changed_when: "'image updated' in set_img_srv.stdout"

    - name: Update Worker Deployment Image
      ansible.builtin.command: >
        kubectl set image deployment/worker-deployment
        worker={{ dockerhub_username }}/smart-inventory-worker:{{ image_tag }}
        -n {{ namespace }}
      when: dockerhub_username != '<DOCKERHUB_USERNAME>'
      register: set_img_wrk
      changed_when: "'image updated' in set_img_wrk.stdout"

    # ------------------------------------------------------------
    # 7. Trigger Rollout Restart & Wait for Completion
    # ------------------------------------------------------------
    - name: Restart Client Deployment Rollout
      ansible.builtin.command: kubectl rollout restart deployment/client-deployment -n {{ namespace }}
      changed_when: true

    - name: Restart Server Deployment Rollout
      ansible.builtin.command: kubectl rollout restart deployment/server-deployment -n {{ namespace }}
      changed_when: true

    - name: Restart Worker Deployment Rollout
      ansible.builtin.command: kubectl rollout restart deployment/worker-deployment -n {{ namespace }}
      changed_when: true

    - name: Wait for Postgres Deployment Rollout
      ansible.builtin.command: kubectl rollout status deployment/postgres-deployment -n {{ namespace }} --timeout={{ rollout_timeout }}
      changed_when: false

    - name: Wait for Server Deployment Rollout (3 replicas)
      ansible.builtin.command: kubectl rollout status deployment/server-deployment -n {{ namespace }} --timeout={{ rollout_timeout }}
      changed_when: false

    - name: Wait for Worker Deployment Rollout
      ansible.builtin.command: kubectl rollout status deployment/worker-deployment -n {{ namespace }} --timeout={{ rollout_timeout }}
      changed_when: false

    - name: Wait for Client Deployment Rollout (3 replicas)
      ansible.builtin.command: kubectl rollout status deployment/client-deployment -n {{ namespace }} --timeout={{ rollout_timeout }}
      changed_when: false

    # ------------------------------------------------------------
    # 8. Post-Deployment Verification Summary
    # ------------------------------------------------------------
    - name: Retrieve Running Pods
      ansible.builtin.command: kubectl get pods -n {{ namespace }} -l app=smart-inventory -o wide
      register: pods_summary
      changed_when: false

    - name: Retrieve Services & Ingress Status
      ansible.builtin.command: kubectl get svc,ingress -n {{ namespace }} -l app=smart-inventory
      register: svc_summary
      changed_when: false

    - name: Print Deployment Status Summary
      ansible.builtin.debug:
        msg:
          - "=== PODS STATUS ==="
          - "{{ pods_summary.stdout_lines }}"
          - "=== SERVICES & INGRESS ==="
          - "{{ svc_summary.stdout_lines }}"
